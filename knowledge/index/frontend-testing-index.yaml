title: "前端工程与测试"
description: "前端工程化与测试接入的已验证做法（Vue 3 + Vitest + Tauri 模拟）。"

items:
  - id: frontend-testing-notes
    title: "Vue 3 + Vitest 组件测试接入"
    path: "knowledge/frontend-testing-notes.md"
    summary: "按文件启用 jsdom（// @vitest-environment jsdom）；挂载页面的 RouterLink stub、Tauri 运行时补丁、await flushPromises；vi.mock 命令层与 importOriginal 部分替换；模块作用域读 import.meta.env 时需先 stubEnv 再动态 import；事件上抛型组件要 setProps 模拟父级更新；保活测试使用真实memory Router，共享模块状态的组件必须卸载以清理watch。"
    tags: ["frontend", "testing", "vitest", "vue"]
    verifiedAt: "2026-10-16"

  - id: frontend-reliability-notes
    title: "前端异步数据与配置一致性"
    path: "knowledge/frontend-reliability-notes.md"
    summary: "刷新仅允许最新请求提交，记录数据时间范围并标注旧数据；聚合区分complete/partial/failed，分页触顶保留任务并产生warnings；配置串行保存、成功后提交状态、失败提示且不阻断后续写入；原生checkbox/color事件需恢复已确认值；Worker快照复用与响应式结果校验、错误保真；完整响应缓存保留原始时间；KeepAlive停用门控配置加载，后台工作继续，激活恢复视口，卸载释放资源。"
    tags: ["frontend", "reliability", "async", "pagination", "settings", "testing", "worker", "cache", "keepalive"]
    verifiedAt: "2026-10-16"
