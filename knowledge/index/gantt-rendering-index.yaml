title: "甘特图渲染"
description: "团队成员分组甘特图的渲染方案选型与约束。"

items:
  - id: gantt-rendering-decision
    title: "甘特图渲染选型：自研 SVG 而非 Frappe Gantt"
    path: "knowledge/gantt-rendering-decision.md"
    summary: "Frappe Gantt 行高与纵坐标由任务下标唯一决定且无左侧任务名列，无法低成本实现成员分组；采用项目内自研 SVG 渲染层与统一布局计算。"
    tags: ["gantt", "frontend", "rendering"]
    verifiedAt: "2026-10-10"

  - id: mcp-gantt-interaction-notes
    title: "MCP 甘特图工时关联、虚拟排期与交互"
    path: "knowledge/mcp-gantt-interaction-notes.md"
    summary: "工时关联资料在计算后独立补查；缺有效日期按成员首末投入日生成连续虚拟条，负责人流转或排期外工时按日补块；无有效排期且本人无区间实际工时的任务隐藏，旧标记不生成行；先过滤再计数分页，MCP与SVG/PNG/HTML共用转换；0.2.6本机已部署、107项测试通过，十月任务55→40且工时不变，原生Apps完整交互仍待验。"
    tags: ["mcp-apps", "gantt", "hours", "worklog", "virtual-schedule", "export", "drawer", "tooltip", "iframe", "validation"]
    verifiedAt: "2026-11-06"
