  - id: teamsight-server-runtime-notes
    title: "TeamSight Server / MCP Apps 运行与验收边界"
    path: "knowledge/teamsight-server-runtime-notes.md"
    summary: "0.3.5在macOS arm64、Windows x64提供双包Pages入口和独立Codex助手；macOS LaunchAgent／Windows 5.1非管理员登录任务、隔离HTTPS与Codex状态调用通过；Windows 0.3.3和0.3.4受管升级回滚通过，DBv4/配置v6及凭据保留，实际重登和正式Release/Pages接收端待验收；Node22.14+<23/API10+、双包哈希；评论回执、未知核实及连接指纹。"
