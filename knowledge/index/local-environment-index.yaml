  - id: teamsight-mcp-config-scope
    title: "TeamSight MCP 配置、项目范围与工时规则"
    path: "knowledge/teamsight-mcp-config-scope.md"
    summary: "0.3.4首次持久配置默认任务/缺陷、create/update/comment、八标准字段及中国日历全选；已有空列表/缺失权限/关闭日历不回填，自定义字段保留，UI快照覆盖初始化；schema v6七类设置与局部保存，身份/显式分组及启用可访问项目范围；评论独立权限、唯一作者/回复归属/修订与连接指纹；工时v3及历史限制不变。"
