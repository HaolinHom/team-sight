items:
  - id: teamsight-server-runtime-notes
    title: "TeamSight Server / MCP Apps 运行与验收边界"
    path: "knowledge/teamsight-server-runtime-notes.md"
    summary: "MCP 0.3.3、37 工具/2 项资源；macOS arm64/Windows x64 各有 bundled/external，私有 Node 22.23.4、外部 Node 22.14+（<23、Node-API 10+），构建与验收元数据分离；DB v4/配置 v6/TeamSight.MCP 凭据库，升级/双包切换无迁移，旧库显式迁移及缓存/批次恢复边界；macOS 固定HTTP安装器、LaunchAgent、Codex静态Bearer，公网/接收端须独立验收；Windows 10 x64 双包原生/隔离MCP通过，nvm开发、PowerShell 7本地bundled安装、用户级隐藏登录任务、SID/DACL、卸载保留数据；Codex工具与连接设置卡片通过，完整分析卡片、真实TAPD及登录/系统重启仍未验收。"
    tags: ["teamsight", "server", "mcp", "mcp-apps", "sqlite", "keyring", "packaging", "installer", "http", "codex-config", "launchagent", "windows", "powershell", "nvm", "scheduled-task", "acl", "validation", "planning", "simulation", "batch", "recovery", "cache"]
    verifiedAt: "2026-11-12"

  - id: teamsight-mcp-config-scope
    title: "TeamSight MCP 配置、项目范围与工时规则"
    path: "knowledge/teamsight-mcp-config-scope.md"
    summary: "schema v6 七类设置与局部保存；完整账号身份，无工号用 user:账号，歧义返回候选；身份目录不等于默认组，范围按显式成员/分组/self/默认组解析并按 order 排序；启用且可访问项目统一默认查询与写入范围，仍限制操作及字段；工时仅 v3，无请假；历史只读导出，旧规则禁止新计算及写入。"
    tags: ["teamsight", "mcp", "settings", "workspace", "permissions", "hours", "compatibility", "identity", "member-scope", "groups", "member-order"]
    verifiedAt: "2026-11-06"
