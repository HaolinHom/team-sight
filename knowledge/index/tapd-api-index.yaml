items:
  - id: tapd-api-auth-and-errors
    title: "TAPD 认证、错误语义与访问能力"
    path: "knowledge/tapd-api-auth-and-errors.md"
    summary: "历史个人令牌样本使用 Bearer，无效令牌 422、越权项目 403；项目通过 user_participant_projects 枚举，单项目详情为对象；浏览器 CORS 预检样本 404；当前 Apps 走宿主桥及 Node 服务端请求，无 Rust 代理，项目范围不按 category 硬过滤。"
    tags: ["tapd", "auth", "error-handling", "cors", "workspace"]
    verifiedAt: "2026-11-06"

  - id: tapd-api-workitem-queries
    title: "TAPD 工作项查询、历史与附件接口"
    path: "knowledge/tapd-api-workitem-queries.md"
    summary: "任务/缺陷标题与负责人字段不同，身份支持工号或完整账号；列表 200、历史 WorkitemChange/100、附件 Attachment/200；下载 300 秒仅为契约提示；时间仅闭区间，缺日期需 null；owner 不支持多值，当前工时按成员查而不加日期限制；完成状态含自定义配置，原始 effort 与计算缺省分开；生成 tapd_fe/detail，仍接受有效旧链接输入。"
    tags: ["tapd", "api", "query", "pagination", "null-filter", "effort", "status", "history", "attachments", "identity"]
    verifiedAt: "2026-11-06"

  - id: tapd-api-timesheets
    title: "TAPD 工时查询与每日统计"
    path: "knowledge/tapd-api-timesheets.md"
    summary: "每日实际按花费日期查询且截至计算日，未结束任务累计独立查询、不按当前负责人过滤；完整账号身份，项目+记录 ID 去重；满页探测 count、重复和截断标不完整；先完整区间分配后裁剪，未知不补零，MCP 输出小时但 API 样本不证明所有项目单位一致。"
    tags: ["tapd", "timesheet", "hours", "pagination", "identity", "completeness"]
    verifiedAt: "2026-11-06"
