items:
  - id: tauri-desktop-external-link
    title: "Tauri 2 外部链接、后台命令与内部拖拽"
    path: "knowledge/tauri-desktop-notes.md"
    summary: "外链用 opener 插件及权限作用域，glob * 可跨 /，打开失败显式回显；同步 command 阻塞HTTP移到 async与spawn_blocking，请求并发3且活动HTTP不能立即取消；内部排序用 Pointer Events及capture，按实际坐标命中并在释放时重算、取消时清理，macOS生产包拖拽与持久化实测，不能只依赖模拟事件。"
    tags: ["tauri", "desktop", "capability", "external-link", "async", "performance", "pointer", "drag"]
