[package]
name = "team-sight"
version = "0.1.0"
description = "TAPD 跨项目团队排期看板"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "team_sight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.10"
